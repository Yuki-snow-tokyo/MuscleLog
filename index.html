<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>筋トレ手帳</title>
<meta name="theme-color" content="#ECEEEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="筋トレ手帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --surface-2:#F3F5F3; --ink:#161A1D; --ink-2:#56606A; --ink-3:#8A939A; --line:#D7DCD9;
  --accent:#1D4ED0; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB;
  --good:#1B7A45; --good-soft:#DBF0E2; --pr:#C4372C; --pr-soft:#F8E0DC; --warn:#9A620C; --warn-soft:#F7EBD4;
  --scrim:rgba(14,17,19,.42);
  --shadow:0 1px 2px rgba(20,24,28,.06),0 6px 18px rgba(20,24,28,.05);
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --tab-h:62px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15191D; --surface:#21272C; --surface-2:#2D343A; --ink:#F5F7F6; --ink-2:#C6CDD2; --ink-3:#9BA5AC; --line:#434C53;
    --accent:#8DAEFF; --accent-ink:#0A0E16; --accent-soft:#283862;
    --good:#62D393; --good-soft:#1D3D2A; --pr:#FF8A78; --pr-soft:#4A2622; --warn:#F2BA58; --warn-soft:#433312;
    --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15191D; --surface:#21272C; --surface-2:#2D343A; --ink:#F5F7F6; --ink-2:#C6CDD2; --ink-3:#9BA5AC; --line:#434C53;
  --accent:#8DAEFF; --accent-ink:#0A0E16; --accent-soft:#283862;
  --good:#62D393; --good-soft:#1D3D2A; --pr:#FF8A78; --pr-soft:#4A2622; --warn:#F2BA58; --warn-soft:#433312;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:500}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:10px 8px;margin-inline:-16px;padding-inline:12px}
.top h1{font-size:19px;font-weight:700;flex:1;padding-left:4px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.datebtn{flex:1;display:flex;align-items:baseline;justify-content:center;gap:8px;padding:4px 8px;border-radius:10px}
.datebtn .d{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1}
.datebtn .w{font-size:13px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

/* banner */
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;flex-wrap:wrap}
.banner b{color:var(--warn)}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px}
.summary>div{padding:10px 12px;display:flex;flex-direction:column;gap:0}
.summary>div+div{border-left:1px solid var(--line)}
.summary .v{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.summary .v small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:2px}
.parts-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px 3px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c,var(--ink-3));flex:none}

/* entries */
.entries{display:flex;flex-direction:column;gap:12px}
.entry{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 12px 10px;border-top:4px solid var(--c,var(--line))}
.entry-head{display:flex;align-items:center;gap:8px}
.entry-head h3{font-size:17px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.entry-head .icon-btn{width:34px;height:34px;margin-right:-4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px;font-size:13px}
.target{display:inline-flex;align-items:baseline;gap:3px;color:var(--ink-2)}
.target b{font-family:var(--f-num);font-size:18px;color:var(--ink);font-weight:700}
.yt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--pr);background:var(--pr-soft);padding:3px 9px;border-radius:99px}
.yt svg{width:13px;height:13px}
.linkish{font-size:12.5px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.last{margin-top:8px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 9px;overflow-wrap:anywhere}
.last .num{font-size:15px;color:var(--ink);font-weight:600}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 50px 54px 30px;gap:6px;align-items:center}
.set.hd{font-size:11.5px;color:var(--ink-2);letter-spacing:.04em}
.set.hd span{text-align:center}
.set .no{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--ink-3);text-align:center}
.set.hit .no{color:var(--good)}
.field{position:relative}
.field input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-family:var(--f-num);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums;padding:0 4px}
.field input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.set.hit .field input{border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.tog{height:34px;border-radius:8px;border:1px dashed var(--ink-3);font-size:12px;color:var(--ink-2)}
.tog[aria-pressed="true"]{border-style:solid;border-color:var(--warn);color:var(--warn);background:var(--warn-soft);font-weight:700}
.rm{font-family:var(--f-num);font-size:15px;text-align:right;color:var(--ink-2);line-height:1.1}
.rm .pr{display:block;font-size:10px;font-weight:700;color:var(--pr);letter-spacing:.06em}
.del{width:30px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.del svg{width:16px;height:16px}
.entry-foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:11px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--pr-soft);color:var(--pr)}
.btn.block{width:100%}
.btn.grow{flex:1}
.btn:disabled{opacity:.45}
.memo-in{width:100%;margin-top:8px;border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:13.5px;padding:6px 2px}
.memo-in:focus{outline:none;border-bottom-color:var(--accent)}
.cardio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.cardio label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions .btn.primary{grid-column:1/-1;height:48px;font-size:15px}
.empty{text-align:center;color:var(--ink-2);padding:28px 12px;background:var(--surface);border-radius:16px;border:1px dashed var(--line)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.section{margin-top:22px}
.section>h2{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin-bottom:8px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.row>.grow{flex:1;min-width:0}
textarea.plain{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:14px;resize:vertical}
input.plain,select.plain{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:0 12px;font-size:16px}
input.plain:focus,select.plain:focus,textarea.plain:focus{outline:none;border-color:var(--accent)}
.bw{display:flex;align-items:center;gap:10px}
.bw .field{width:110px}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:8;display:flex;justify-content:center;pointer-events:none;padding-inline:12px;padding-block:0 10px}
.timer-in{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25);width:100%;max-width:420px}
.timer-in .t{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;flex:1}
.timer-in .t small{font-family:var(--f-body);font-size:11px;font-weight:500;opacity:.7;display:block;letter-spacing:.06em}
.timer-in button{height:40px;min-width:46px;border-radius:10px;background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg);font-family:var(--f-num);font-weight:700;font-size:17px;padding:0 10px}
.timer-in.done{background:var(--good);color:#fff}
.timer-in.done button{color:#fff}
.bar{height:3px;border-radius:2px;background:color-mix(in srgb,var(--bg) 25%,transparent);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bg);width:0}
.fabs{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:8px}
.fab{height:48px;padding:0 16px 0 12px;border-radius:24px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:700;font-size:19px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.fab svg{width:22px;height:22px}
.fab.up{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.timer-in.up .t{color:var(--bg)}
.timer-in button.on{background:color-mix(in srgb,var(--bg) 30%,transparent)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink-2);font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:90%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:21;padding-inline:16px;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-8px;background:var(--bg);padding-block:6px;z-index:2}
.sheet-head h2{font-size:17px;flex:1}
.form{display:flex;flex-direction:column;gap:14px}
.form label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.hscroll .chip{font-size:13px;padding:6px 12px 6px 9px;border:1px solid transparent}
.hscroll .chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);font-weight:700}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:52px;text-align:left;width:100%}
.li+.li{border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .s{font-size:12px;color:var(--ink-2)}
.li:active{background:var(--surface-2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:8px;background:var(--c);border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.thumb{display:block;width:100%;max-width:320px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.confirm-box{display:flex;flex-direction:column;gap:14px;padding-block:6px}

/* calendar */
.cal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .wd{font-size:11px;text-align:center;color:var(--ink-3);padding:4px 0}
.cal-grid .wd:first-child{color:var(--pr)}
.cd{aspect-ratio:1/1.08;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px}
.cd .n{font-family:var(--f-num);font-size:17px;font-weight:600;line-height:1}
.cd.out{visibility:hidden}
.cd.today .n{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:3px 6px}
.cd.sel{background:var(--accent-soft)}
.cd.has{background:var(--surface-2)}
.cd.has.sel{background:var(--accent-soft)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.since .li .d{font-family:var(--f-num);font-weight:700;font-size:22px;line-height:1}
.since .li .d small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--ink-2);margin-left:2px}
.since .li.stale .d{color:var(--warn)}

/* analysis */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--ink-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart .endl{font-size:14px;font-weight:700;fill:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--f-num);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--ink-2);margin-left:2px}
.hist .li .t .num{font-size:16px}

/* tools */
.rm-out{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.rm-out .v{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rm-table{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.rm-table div{background:var(--surface-2);border-radius:9px;padding:6px 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-2)}
.rm-table b{font-family:var(--f-num);font-size:17px;color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.switch+.switch{border-top:1px solid var(--line)}
.switch input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.switch input.plain{width:90px;text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.share-img{width:100%;border-radius:12px;display:block}
/* video links */
.vid-rows{display:flex;flex-direction:column;gap:10px}
.vid-row{display:flex;gap:8px;align-items:flex-start}
.vid-row .no{width:18px;font-size:18px;font-weight:700;color:var(--ink-3);padding-top:9px;text-align:center}
.vid-in{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vid-in input{font-size:15px}
.vid-open{display:flex;align-items:center;gap:10px;text-decoration:none}
.vid-open .thumb{width:96px;border-radius:8px}
.yt{overflow-wrap:anywhere}
.no-badge{display:inline-block;font-weight:700;font-size:14px;line-height:1.5;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 7px;white-space:nowrap}
.menu-li{align-items:flex-start;gap:10px}
.menu-li input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
select.plain.menu-part{width:auto;min-width:120px;height:36px;font-size:14px;padding:0 8px}
.menu-partrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin:14px 2px 8px}
.sec-h .num{font-size:18px;color:var(--ink-2)}.sec-h .num.ok{color:var(--good)}
.entry.prep{border-top:4px solid var(--ink-3);padding-bottom:12px}
.entry.prep.done{border-top-color:var(--good)}
.entry.prep .meta b{color:var(--ink);font-size:14px}
.chk-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chk{height:44px;min-width:84px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px;color:var(--ink)}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}

<script>
(()=>{
'use strict';
const KEY='kintore-techo-v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d)};
const todayStr=()=>fmtDate(new Date());
const WD='日月火水木金土';
const md=s=>{const d=parseDate(s);return `${d.getMonth()+1}/${d.getDate()}`};
const dayDiff=(a,b)=>Math.round((parseDate(b)-parseDate(a))/864e5);
const rel=s=>{const n=dayDiff(s,todayStr());return n===0?'今日':n===1?'昨日':n>0?`${n}日前`:`${-n}日後`};
const COLORS=['#C8392E','#2459B8','#D9A21B','#2E8B57','#6B4FA0','#D06A1E','#1F8A8A','#B8336A','#6B7280'];
const LB=2.20462;

const I={
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5"/></svg>',

  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',

/* ---------- data ---------- */
function seed(){
  const parts=[['胸',0],['背中',1],['肩',2],['腕',3],['脚',4],['腹',5],['有酸素',6]].map(([n,c])=>({id:uid(),name:n,color:COLORS[c]}));
  const P=Object.fromEntries(parts.map(p=>[p.name,p.id]));
  const ex=[];
  const add=(part,list,type='weight')=>list.forEach(name=>ex.push({id:uid(),partId:P[part],name,type,tw:null,tr:null,ts:null,yt:'',memo:''}));
  add('胸',['ベンチプレス','インクラインダンベルプレス','ダンベルフライ','ディップス','ケーブルクロスオーバー']);
  add('背中',['デッドリフト','懸垂','ラットプルダウン','ベントオーバーロウ','シーテッドロウ']);
  add('肩',['ショルダープレス','サイドレイズ','リアレイズ','フェイスプル']);
  add('腕',['バーベルカール','ハンマーカール','トライセプスプレスダウン','ライイングエクステンション']);
  add('脚',['スクワット','レッグプレス','ルーマニアンデッドリフト','レッグエクステンション','レッグカール','カーフレイズ']);
  add('腹',['クランチ','レッグレイズ','アブローラー','プランク']);
  add('有酸素',['ランニング','バイク','ウォーキング'],'cardio');
  return {v:1,settings:{unit:'kg',rest:90,autoTimer:true},parts,exercises:ex,logs:{},body:{},sample:false};
}
function addSample(D){
  const by=n=>D.exercises.find(e=>e.name===n);
  const tg={'ベンチプレス':[65,10,3],'スクワット':[90,8,3],'デッドリフト':[120,6,3],'ラットプルダウン':[55,10,3],'サイドレイズ':[8,15,3]};
  for(const [n,[w,r,s]] of Object.entries(tg)){const e=by(n);if(e&&e.tw==null){e.tw=w;e.tr=r;e.ts=s;e.sampleT=true}}
  const plan={
    A:[['ベンチプレス',55,2.5,10],['インクラインダンベルプレス',18,1,10],['サイドレイズ',6,.5,15],['トライセプスプレスダウン',20,2.5,12]],
    B:[['デッドリフト',95,5,6],['ラットプルダウン',45,2.5,10],['ベントオーバーロウ',50,2.5,10],['バーベルカール',25,1.25,10]],
    C:[['スクワット',70,5,8],['レッグプレス',120,10,12],['レッグカール',30,2.5,12],['アブローラー',0,0,12]]
  };
  const order=['A','B','C'],cnt={A:0,B:0,C:0},today=todayStr();
  let n=0;
  for(let back=26;back>=0;back-=2){
    const date=addDays(today,-back),k=order[n%3],c=cnt[k]++;n++;
    let items=plan[k];if(back===0)items=items.slice(0,2);
    const e=items.map(([name,base,inc,reps],j)=>{
      const x=by(name);const w=base+inc*c;
      const sets=[0,1,2].map(i=>({w,r:Math.max(1,reps-(i===2&&(c+j)%2===0?2:0)-(i===1&&c%3===2?1:0)),a:i===2&&k==='A'&&j===0&&c%2===1}));
      if(back===0&&j===1)sets.length=1;
      return {id:uid(),ex:x.id,sets,memo:'',sample:true};
    });
    if(n%4===0)e.push({id:uid(),ex:by('ランニング').id,sets:[],c:{min:20+c,km:+(3.1+c*.1).toFixed(1),kcal:210+c*8},memo:'',sample:true});
    D.logs[date]={e,memo:back===4?'肩の調子よし。ベンチ最終セットは補助つき':'' ,sample:true};
  }
  for(let back=27;back>=0;back--){D.body[addDays(today,-back)]=+(73.6-back*.035+Math.sin(back*1.3)*.25).toFixed(1)}
  D.sample=true;
}
/* ---------- cloud (Supabase REST, no library) ---------- */
const CFG_KEY='kintore-cfg',SES_KEY='kintore-session',LEGACY_DONE='kintore-legacy-migrated';
function lsGet(k){try{const t=localStorage.getItem(k);return t?JSON.parse(t):null}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
const fileCfg=(window.KINTORE_CONFIG&&window.KINTORE_CONFIG.url&&window.KINTORE_CONFIG.key)?window.KINTORE_CONFIG:null;
let cfg=fileCfg||lsGet(CFG_KEY);
let ses=lsGet(SES_KEY);
let D=null;
let meta={rev:0,dirty:false,last:null};
let editSeq=0,saveFail=false;
const sync={state:'idle',msg:''};
const dataKey=()=>KEY+':'+ses.user.id,metaKey=()=>KEY+':'+ses.user.id+':meta';
class NetErr extends Error{}
class AuthErr extends Error{}
const baseUrl=()=>cfg.url.replace(/\/+$/,'');
async function http(path,opt){
  let res;try{res=await fetch(baseUrl()+path,opt)}catch(e){throw new NetErr('offline')}
  const t=await res.text();let json=null;try{json=t?JSON.parse(t):null}catch(e){}
  return {status:res.status,json};
}
const authHeaders=()=>({apikey:cfg.key,'Content-Type':'application/json'});
function setSession(j,user){
  ses={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:+j.expires_at||Math.floor(Date.now()/1000)+(+j.expires_in||3600),user:{id:(user||j.user).id,email:(user||j.user).email}};
  lsSet(SES_KEY,ses);
}
let refreshing=null;
async function token(force){
  if(!ses)throw new AuthErr('nosession');
  if(!force&&ses.expires_at-60>Date.now()/1000)return ses.access_token;
  if(!refreshing)refreshing=(async()=>{
    const r=await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:authHeaders(),body:JSON.stringify({refresh_token:ses.refresh_token})});
    if(r.status===200&&r.json&&r.json.access_token){setSession(r.json);return}
    if(r.status>=400&&r.status<500)throw new AuthErr('expired');
    throw new Error('トークン更新に失敗（HTTP '+r.status+'）');
  })().finally(()=>{refreshing=null});
  await refreshing;return ses.access_token;
}
async function rest(method,path,body,prefer,retried){
  const h={apikey:cfg.key,Authorization:'Bearer '+await token(),'Content-Type':'application/json'};

function recommend(ex,date){
  if(!ex||ex.type!=='weight'||ex.tr==null||ex.rec===false)return null;

  const lr=lastRecord(ex.id,date);
  if(!lr)return ex.tw?{w:ex.tw,kind:'start',reason:'記録がまだないので、コーチ指定の開始重量から'}:null;
  const ss=lr.en.sets.filter(x=>x.r!==''&&x.r!=null);if(!ss.length)return null;

  if(asst.length){
    const AW=Math.min(...asst.map(x=>+x.aw)),W=Math.max(...asst.map(x=>+x.w||0));
    const good=asst.filter(x=>+x.aw<=AW&&+x.r>=tr).length;
    if(good>=need){const nx=Math.max(0,r2(AW-inc));return {w:W,aw:nx,kind:'up',reason:`前回 ${when}：アシスト${fw(AW)}${U()}で${tr}回×${need}セットをクリア → アシストを${fw(inc)}${U()}減らす`}}
    return {w:W,aw:AW,kind:'keep',reason:`前回 ${when}：アシスト${fw(AW)}${U()}で ${asst.map(x=>x.r).join('・')}回。全セット${tr}回できたらアシストを減らす`};
  }
  const W=Math.max(...ss.map(x=>+x.w||0));if(!W)return null;
  const atW=ss.filter(x=>+x.w>=W),good=atW.filter(x=>!x.a&&+x.r>=tr).length;
  if(lr.en.pain)return {w:W,kind:'keep',reason:`前回 ${when}：${fw(W)}${U()}で違和感あり → 重さは上げずにフォーム優先。痛みが出るなら軽くするかコーチに相談`};
  if(good>=need)return {w:r2(W+inc),kind:'up',reason:`前回 ${when}：${fw(W)}${U()}で${tr}回×${need}セットをクリア${lr.en.feel==='easy'?'（余裕）':lr.en.feel==='hard'?'（ギリギリ）':''} → +${fw(inc)}${U()}${lr.en.feel==='easy'?`。余裕があったので +${fw(r2(inc*2))}${U()} も可`:lr.en.feel==='hard'?'。フォームが崩れるなら据え置きでもOK':''}`};
  const prev=lastRecord(ex.id,lr.date),pW=prev?Math.max(0,...prev.en.sets.filter(x=>x.r!==''&&x.r!=null).map(x=>+x.w||0)):0;

  return {w:W,kind:'keep',reason:`前回 ${when}：${fw(W)}${U()}で ${atW.map(x=>x.r+(x.a?'(補)':'')).join('・')}回。全セット${tr}回できたら次は+${fw(inc)}${U()}${stuck?`（2回続けて未達。フォームが崩れるなら ${fw(r2(W-inc))}${U()} に戻すのも手）`:''}`};
}

function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function lineChart(pts,unit){
  if(!pts.length)return '<div class="empty" style="border:0">この期間の記録がありません</div>';
  const W=340,H=200,pl=38,pr=18,pt=22,pb=24;
  const xs=pts.map(p=>parseDate(p.x).getTime());let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=3*864e5;x1+=3*864e5}
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));if(y0===y1){y0-=Math.max(1,Math.abs(y0)*.05);y1+=Math.max(1,Math.abs(y1)*.05)}
  const step=niceStep((y1-y0)/4);y0=Math.floor(y0/step)*step;y1=Math.ceil(y1/step)*step;
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  let g='';for(let v=y0;v<=y1+1e-9;v+=step){const yy=Y(v).toFixed(1);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-6}" y="${+yy+3.5}" text-anchor="end">${+v.toFixed(2)}</text>`}
  const P=pts.map((p,i)=>[X(xs[i]),Y(p.y)]);
  const line=P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const area=line+`L${P.at(-1)[0].toFixed(1)} ${H-pb}L${P[0][0].toFixed(1)} ${H-pb}Z`;
  const dots=P.length<=40?P.slice(0,-1).map(q=>`<circle class="pt" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3"/>`).join(''):'';
  const e=P.at(-1),lab=`${pts.at(-1).y}${unit}`;
  const lx=Math.min(e[0],W-pr-2),anchor=e[0]>W-70?'end':'middle';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="推移グラフ">${g}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}<circle class="end" cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="5"/><text class="endl" x="${lx.toFixed(1)}" y="${Math.max(13,e[1]-10).toFixed(1)}" text-anchor="${anchor}">${lab}</text><text x="${pl}" y="${H-6}">${md(pts[0].x)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${md(pts.at(-1).x)}</text></svg>`;
}

const HDR={no:/^(no\.?|№|番号|#)$/i,name:/種目|メニュー|exercise|エクササイズ/i,w:/重さ|重量|負荷|weight|load/i,r:/回数|reps?|レップ/i,s:/セット|sets?/i};

function menuCells(text,html){
  if(html&&/<t[dh][\s>]/i.test(html)){
    const doc=new DOMParser().parseFromString(html,'text/html');
    const rows=[...doc.querySelectorAll('tr')].map(tr=>[...tr.children].filter(c=>/^T[DH]$/.test(c.tagName)).map(c=>{const a=c.querySelector('a[href^="http"]');return {t:c.textContent.replace(/\s+/g,' ').trim(),href:a?a.getAttribute('href'):''}}));
    if(rows.some(r=>r.length>=2))return rows;
  }
  const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const cell=t=>{t=t.trim();const m=t.match(/^\[(.+?)\]\((https?:[^)\s]+)\)(.*)$/);return m?{t:(m[1]+m[3]).trim(),href:m[2]}:{t,href:''}};
  if(lines.some(l=>l.includes('\t')))return lines.map(l=>l.split('\t').map(cell));
  if(lines.filter(l=>l.startsWith('|')).length>=2)return lines.filter(l=>l.startsWith('|')&&!/^\|[\s:|-]+\|?$/.test(l)).map(l=>l.replace(/^\||\|$/g,'').split('|').map(cell));
  let n=0;while(n<lines.length&&n<6&&Object.values(HDR).some(re=>re.test(lines[n])))n++;
  if(n>=3){const rows=[];for(let i=0;i<lines.length;i+=n)rows.push(lines.slice(i,i+n).map(cell));return rows}
  return lines.map(l=>l.split(/\s{2,}|,|、/).map(cell));
}
const isPrep=ex=>ex&&ex.type==='prep';
const PREP_HEAD=/プレパレーション|ウォームアップ|ウォーミングアップ|warm-?\s?up|preparation|準備運動/i;
function prepItem(raw,href,linkText){
  let t=String(raw||'').replace(/\*\*|__/g,'').replace(/^[\s*\-・•●◦▪︎]+/,'').replace(/[\s\u3000]+/g,' ').trim();
  let name='',rest='';
  const m=t.match(/\[([^\]]+)\]\((https?:[^)\s]+)\)/);
  if(m){href=href||m[2];name=(t.slice(0,m.index)+m[1]).trim();rest=t.slice(m.index+m[0].length)}
  else if(linkText&&t.includes(linkText.trim())){const lt=linkText.replace(/\*\*/g,'').replace(/[\s\u3000]+/g,' ').trim(),i=t.indexOf(lt);name=(t.slice(0,i)+lt).trim();rest=t.slice(i+lt.length)}
  else{const k=t.normalize('NFKC').match(/^(.*?)\s*(\d+\s*(?:秒|回|セット|sets?|分|reps?|往復|歩|m\b).*)$/i);if(k&&k[1].trim()){name=k[1].trim();rest=k[2]}else{name=t;rest=''}}
  rest=rest.normalize('NFKC').trim();name=name.trim();if(!name)return null;
  const rn=rest.match(/(\d+)\s*(?:回|reps?)/i),sn=rest.match(/(\d+)\s*(?:セット|sets?)/i);
  const exist=D.exercises.find(e=>e.name.trim().toLowerCase()===name.toLowerCase());
  return {kind:'prep',on:true,no:'',name,href:href||'',tw:null,tr:rn?+rn[1]:null,ts:sn?+sn[1]:null,rx:rest,partId:prepPartId(false),exist:!!exist};
}
function prepPartId(create){let p=D.parts.find(x=>PREP_HEAD.test(x.name));if(!p&&create){p={id:uid(),name:'プレパレーション',color:'#6B7280'};D.parts.unshift(p)}return p?p.id:'__prep'}
const cleanHead=t=>String(t||'').replace(/^#+\s*/,'').replace(/\*\*|__/g,'').replace(/[\s　]+/g,' ').trim().slice(0,40);
function parseMenuAll(text,html){
  const prep=[],secs=[];
  const addSec=(name,rows)=>{rows=rows.filter(r=>!PREP_HEAD.test(r.name));if(rows.length)secs.push({name:cleanHead(name),rows})};
  if(html&&/<(li|table)[\s>]/i.test(html)){
    const doc=new DOMParser().parseFromString(html,'text/html');let head='';
    doc.body.querySelectorAll('h1,h2,h3,h4,h5,h6,p,div,li,table').forEach(el=>{
      const tag=el.tagName;
      if(tag==='TABLE'){if(el.parentElement&&el.parentElement.closest('table'))return;addSec(head,parseMenu('',el.outerHTML));return}
      if(el.closest('table'))return;
      if(tag==='LI'){const a=el.querySelector('a[href^="http"]');const it=prepItem(el.textContent,a?a.getAttribute('href'):'',a?a.textContent:'');if(it)prep.push(it);return}
      if(el.closest('li'))return;
      if(/^H\d$/.test(tag)){head=el.textContent;return}
      if(el.querySelector('p,div,li,table,h1,h2,h3,h4,h5,h6'))return;
      const t=el.textContent.trim();if(t&&t.length<=40)head=t;
    });
    if(!prep.length&&!secs.length)addSec('',parseMenu(text,html));
  }else{
    const lines=String(text||'').replace(/\r/g,'').split('\n');
    const bullet=/^\s*([*\-・•●◦▪︎]|\d+[.)])\s+/,isTbl=l=>l.includes('\t')||l.trim().startsWith('|');
    if(lines.some(l=>bullet.test(l))||lines.some(isTbl)){
      let head='',blk=[];const flush=()=>{if(blk.length){addSec(head,parseMenu(blk.join('\n'),''));blk=[]}};
      for(const l of lines){if(!l.trim())continue;
        if(bullet.test(l)){flush();const it=prepItem(l.replace(bullet,''));if(it)prep.push(it)}
        else if(isTbl(l))blk.push(l);
        else{flush();head=l}}
      flush();
    }else addSec('',parseMenu(text,''));

    const yts=[0,1,2].map(i=>{let u=$('#xy'+i).value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;return {u,t:$('#xl'+i).value.trim()}}).filter(v=>v.u);const yt=yts[0]?yts[0].u:'';
    const data={name,partId:$('#xp').value,type:$('#xt').value,tw:w==null?null:toKg(w),tr:r==null?null:Math.round(r),ts:s==null?null:Math.round(s),inc:(()=>{const v=num($('#xinc').value);return v==null?null:toKg(v)})(),rec:$('#xrec').checked,yt,yts,rx:$('#xrx').value.trim(),memo:$('#xm').value.trim()};
    const fromAdd=st.sheet.fromAdd;let id=el.dataset.id;
    if(id){const e=exById(id);Object.assign(e,data);delete e.sampleT}else{id=uid();D.exercises.push({id,...data})}
    save();

    closeSheet();render();toast('保存しました')},
  delEx:el=>{const e=exById(el.dataset.id);let n=0;for(const d in D.logs)n+=D.logs[d].e.filter(x=>x.ex===e.id).length;
    confirmSheet('種目を削除しますか？',`「${esc(e.name)}」を削除します。${n?`この種目の記録 <b>${n}件</b> も一緒に消えます。`:''}`,'削除する',()=>{D.exercises=D.exercises.filter(x=>x.id!==e.id);for(const d of Object.keys(D.logs)){D.logs[d].e=D.logs[d].e.filter(x=>x.ex!==e.id);cleanDay(d)}if(st.ax===e.id)st.ax=null;save();closeSheet();render()})},
  moveEx:el=>{const e=exById(el.dataset.id);const same=D.exercises.filter(x=>x.partId===e.partId);const i=same.indexOf(e),o=same[i+ +el.dataset.n];if(!o)return;const a=D.exercises.indexOf(e),b=D.exercises.indexOf(o);[D.exercises[a],D.exercises[b]]=[D.exercises[b],D.exercises[a]];save();render()},
  movePart:el=>{const i=D.parts.findIndex(p=>p.id===el.dataset.id),j=i+ +el.dataset.n;if(j<0||j>=D.parts.length)return;[D.parts[i],D.parts[j]]=[D.parts[j],D.parts[i]];save();render()},
  editPart:el=>{st.pc=el.dataset.id?partById(el.dataset.id).color:null;openSheet({type:'partEdit',id:el.dataset.id||null})},
  pickColor:el=>{st.pc=el.dataset.v;$$('.swatches button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.pc))},
  savePart:el=>{const name=$('#pn').value.trim();if(!name){toast('部位名を入れてください');return}const id=el.dataset.id;if(id)Object.assign(partById(id),{name,color:st.pc});else D.parts.push({id:uid(),name,color:st.pc});save();closeSheet();render()},
  delPart:el=>{const p=partById(el.dataset.id);if(D.exercises.some(e=>e.partId===p.id)){toast('先にこの部位の種目を削除するか、別の部位へ移してください');return}confirmSheet('部位を削除しますか？',`「${esc(p.name)}」を削除します。`,'削除する',()=>{D.parts=D.parts.filter(x=>x.id!==p.id);save();closeSheet();render()})},
  confirmOk:()=>{const f=st.confirmFn;st.confirmFn=null;f&&f()},
  closeSheet:()=>closeSheet(),
  menuOpen:()=>openSheet({type:'menuImport',name:'プログラム '+md(todayStr()),rows:[],raw:'',target:''}),
  menuParse:()=>runMenuParse($('#menuPaste').value,''),
  menuDo:()=>{const s=st.sheet,rows=s.rows.filter(r=>r.on);if(!rows.length)return;const items=[];
    rows.forEach(r=>{let e=D.exercises.find(x=>x.name.trim().toLowerCase()===r.name.toLowerCase());
      const pid=r.kind==='prep'?prepPartId(true):r.partId;
      if(!e){e={id:uid(),partId:pid,name:r.name,type:r.kind==='prep'?'prep':partById(pid)?.name==='有酸素'?'cardio':'weight',tw:null,tr:null,ts:null,yt:'',yts:[],memo:''};D.exercises.push(e)}else{e.partId=pid;if(r.kind==='prep')e.type='prep'}
      if(r.tw!=null)e.tw=r.tw;else if(r.rx)e.tw=null;if(r.tr!=null)e.tr=r.tr;if(r.ts!=null)e.ts=r.ts;if(r.rx)e.rx=r.rx;delete e.sampleT;
      if(r.href){const v=vids(e).filter(x=>x.u!==r.href);e.yts=[{u:r.href,t:''},...v].slice(0,3);e.yt=e.yts[0].u}
      items.push({ex:e.id,no:r.no,rx:r.rx,kind:r.kind||'main',sec:r.sec})});
    let pg=s.target&&D.programs.find(p=>p.id===s.target);
    if(pg){const ids=new Set(items.map(x=>x.ex));pg.items=[...items.filter(x=>x.kind==='prep'),...pg.items.filter(x=>!ids.has(x.ex)),...items.filter(x=>x.kind!=='prep')].map(({sec,...x})=>x);save();st.view='ex';render();openSheet({type:'program',id:pg.id});toast(`${items.length}種目を追加しました`);return}
    const strip=({sec,...x})=>x;let pre=items.filter(x=>x.kind==='prep').map(strip);
    if(!pre.length&&s.incPrep){const src=latestPrepProgram();if(src)pre=src.items.filter(it=>isPrep(exById(it.ex))).map(x=>({...x}))}
    const secIdx=[...new Set(items.filter(x=>x.kind!=='prep').map(x=>x.sec))],batch=uid(),made=[];
    const mk=(name,its)=>({id:uid(),name:(name||'').trim()||'プログラム '+md(todayStr()),date:todayStr(),batch,items:its});
    if(!secIdx.length)made.push(mk(s.name,pre));
    else secIdx.forEach(si=>made.push(mk(secIdx.length>1?(s.secs[si]||'メニュー'+'ABCDEFGH'[si]):(s.name||s.secs[si]),[...pre.map(x=>({...x})),...items.filter(x=>x.kind!=='prep'&&x.sec===si).map(strip)])));
    D.programs.unshift(...made);save();st.view='record';window.scrollTo(0,0);render();closeSheet();
    toast(made.length>1?`${made.length}つのプログラムを作りました`:`「${made[0].name}」を作りました`)},
  menuAddTo:el=>openSheet({type:'menuImport',name:'',rows:[],raw:'',target:el.dataset.id}),
  openProgram:el=>openSheet({type:'program',id:el.dataset.id}),
  programPick:()=>{if(D.programs.length===1)openSheet({type:'program',id:D.programs[0].id});else openSheet({type:'programPick'})},
  quickProgram:el=>{const pg=D.programs.find(p=>p.id===el.dataset.id);const n=addProgramToDay(pg);pg.lastUsed=st.date;save();render();window.scrollTo(0,0);toast(`「${pg.name}」の${n}種目を追加しました`)},
  programAdd:el=>{const pg=D.programs.find(p=>p.id===el.dataset.id);const n=addProgramToDay(pg);pg.lastUsed=st.date;save();closeSheet();st.view='record';window.scrollTo(0,0);render();toast(n?`${n}種目を追加しました`:'すべて追加済みです')},
  programDel:el=>{const pg=D.programs.find(p=>p.id===el.dataset.id);confirmSheet('プログラムを削除しますか？',`「${esc(pg.name)}」を削除します。種目・目標・これまでの記録は残ります。`,'削除する',()=>{D.programs=D.programs.filter(p=>p.id!==pg.id);save();closeSheet();render()})},
  openReport:()=>{const to=todayStr();openSheet({type:'report',from:monthAgo(to),to})},
  repPreset:el=>{const to=todayStr();st.sheet.to=to;st.sheet.from=el.dataset.v==='2w'?addDays(to,-13):monthAgo(to);renderSheet()},
  repCopy:()=>copyText(st.repText),
  repCopySum:()=>copyText(st.repSum),
  repCopyAI:()=>copyText(st.repAI),

  demo:()=>startDemo(),
  exitDemo:()=>{st.demo=false;D=null;closeSheet();if(!cfg){st.screen='setup';render()}else if(ses)startApp();else{st.screen='login';render()}},
  editCfg:()=>{st.screen='setup';st.authMsg='';render()},
  syncNow:()=>syncRun('pull'),
  openConflict:()=>{if(st.conflictRow)openSheet({type:'conflict'})},
  useCloud:()=>{const row=st.conflictRow;st.conflictRow=null;D=row.data;fixData();meta.rev=row.rev;meta.dirty=false;meta.last=Date.now();saveLocal();saveMeta();closeSheet();render();setSync('synced');toast('クラウドの内容に切り替えました')},
  useLocal:()=>{const row=st.conflictRow;st.conflictRow=null;meta.rev=row.rev;meta.dirty=true;saveMeta();closeSheet();syncRun('push')},
  logout:()=>confirmSheet('ログアウトしますか？',meta.dirty?'<b>まだクラウドに送れていない変更があります。</b>ログアウトするとこの端末から消えます。先に電波のある場所で「今すぐ同期」してください。':'この端末に一時保存している記録を消してログアウトします。記録はクラウドに残っています。','ログアウト',()=>logout(),!!meta.dirty),
  timer:()=>startTimer(),
  tAdj:el=>{T.end+= +el.dataset.n*1000;T.dur=Math.max(1,T.dur+ +el.dataset.n);if(T.end<Date.now())T.end=Date.now();tick()},
  tStop:()=>stopTimer(),
  countUp:()=>startCount(),
  vol:el=>{D.settings.vol=el.dataset.v;save();ensureAudio();render();setTimeout(beep,50)},
  volTest:()=>{ensureAudio();beep()},
  cuStop:()=>stopCount(),
  cuReset:()=>{ensureAudio();CU.acc=0;CU.last=0;CU.start=Date.now();cuTick()},
  cuPause:el=>{ensureAudio();if(CU.paused){CU.start=Date.now();CU.paused=false}else{CU.acc=cuElapsed();CU.paused=true}el.textContent=CU.paused?'再開':'停止'},
  cuSound:()=>{D.settings.tickSound=D.settings.tickSound===false;save();ensureAudio();drawCount();cuTick()},
  theme:el=>{lsSet('kintore-theme',el.dataset.v==='auto'?null:el.dataset.v);applyTheme();render()},
  unit:el=>{D.settings.unit=el.dataset.v;save();render()},
  bodySave:()=>{const v=toKg($('#tbw').value);if(v===''){delete D.body[todayStr()]}else D.body[todayStr()]=v;save();render();toast('体重を保存しました')},
  bodyDel:el=>{delete D.body[el.dataset.d];save();render()},
  exportJSON:()=>{const t=exportText('json');st.exp={name:`kintore-backup-${todayStr()}.json`,text:t,type:'application/json'};openSheet({type:'exportF',title:'バックアップを書き出す',text:t})},
  exportCSV:()=>{const t=exportText('csv');st.exp={name:`kintore-${todayStr()}.csv`,text:t,type:'text/csv'};openSheet({type:'exportF',title:'CSVで書き出す',text:t})},
  saveFile:()=>saveFile(st.exp.name,st.exp.text,st.exp.type),
  copyText:()=>copyText(st.exp.text),
  openImport:()=>openSheet({type:'import'}),
  importText:()=>{const t=$('#imptext').value.trim();if(!t){toast('テキストを貼り付けてください');return}importData(t)},
  shareDay:()=>shareDay(),
  shareImg:async()=>{try{const f=new File([st.shareBlob],`kintore-${st.date}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast('この環境では共有メニューを開けません。画像を長押しで保存してください')}catch(e){if(e.name!=='AbortError')toast('共有できませんでした。画像を長押しで保存してください')}},
  clearSample:()=>confirmSheet('サンプル記録を削除しますか？','サンプルの記録・体重・サンプルで入れた目標を削除します。あなたが自分で追加した記録は残ります。','削除して始める',()=>{
    for(const d of Object.keys(D.logs)){const L=D.logs[d];L.e=L.e.filter(x=>!x.sample);if(L.sample){L.memo='';delete L.sample}cleanDay(d)}D.body={};D.exercises.forEach(e=>{if(e.sampleT){e.tw=e.tr=e.ts=null;delete e.sampleT}});D.sample=false;save();closeSheet();render();toast('サンプルを削除しました')},false),
  loadSample:()=>{const keep=D.logs;D.logs={};const b=D.body;D.body={};addSample(D);for(const d in keep)D.logs[d]=keep[d];Object.assign(D.body,b);save();render();toast('サンプルを読み込みました')},
  wipe:()=>confirmSheet('すべて削除しますか？','記録・体重・種目・目標をすべて削除し、初期状態に戻します。クラウド上のデータも初期化されます（直近30日分の自動スナップショットは管理画面から復元可能）。','すべて削除',()=>{D=seed();fixData();save();st.ax=null;closeSheet();render();toast('初期化しました')}),
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){ev.preventDefault();f(el)}});
document.addEventListener('input',ev=>{
  const el=ev.target,f=el.dataset.f;if(!f)return;
  if(f==='aw'){const en=findEnt(el.dataset.id),i=+el.dataset.i,s=en.sets[i];s.aw=toKg(el.value);save();const tg=$('#tg-'+en.id+'-'+i);if(tg)tg.textContent=s.aw!==''&&s.aw!=null&&+s.aw?'補'+fw(s.aw):'補助';return}
  if(f==='w'||f==='r'){const en=findEnt(el.dataset.id),i=+el.dataset.i,s=en.sets[i];if(f==='w')s.w=toKg(el.value);else{const n=parseInt(el.value);s.r=isNaN(n)?'':n}save();
    const ex=exById(en.ex),row=el.closest('.set');const hit=hitTarget(ex,s);row.classList.toggle('hit',hit);const c=$('#rm-'+en.id+'-'+i);if(c)c.innerHTML=rmCell(s,false);updSummary()}
  else if(f==='c'){const en=findEnt(el.dataset.id);en.c=en.c||{};const n=parseFloat(el.value);en.c[el.dataset.k]=isNaN(n)?'':n;save()}
  else if(f==='emem'){findEnt(el.dataset.id).memo=el.value;save()}
  else if(f==='dmem'){const d=getDay(st.date,true);d.memo=el.value;cleanDay(st.date);save()}
  else if(f==='dbw'){const v=toKg(el.value);if(v==='')delete D.body[st.date];else D.body[st.date]=v;save()}
  else if(f==='rm'){st.rmw=$('#rmw').value;st.rmr=$('#rmr').value;$('#rmout').innerHTML=rmOut()}
  else if(f==='menuName'){st.sheet.name=el.value}
  else if(f==='secName'){st.sheet.secs[+el.dataset.i]=el.value}
  else if(f==='rest'){const n=parseInt(el.value);if(n>0){D.settings.rest=n;save()}}
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.f==='menuOn'){st.sheet.rows[+el.dataset.i].on=el.checked;renderSheet();return}
  if(el.dataset.f==='incPrep'){st.sheet.incPrep=el.checked;return}
  if(el.dataset.f==='menuTarget'){st.sheet.target=el.value;renderSheet();return}
  if(el.dataset.f==='menuPart'){st.sheet.rows[+el.dataset.i].partId=el.value;return}
  if(el.dataset.f==='loudM'){D.settings.loudMode=el.checked;save();applyAudioSession();return}
  if(el.dataset.f==='tickS'){D.settings.tickSound=el.checked;save();return}
  if(el.dataset.f==='autoT'){D.settings.autoTimer=el.checked;save()}
  else if(el.dataset.f==='ax'){st.ax=el.value;render()}
  else if(el.dataset.f==='repFrom'||el.dataset.f==='repTo'){if(!el.value)return;if(el.dataset.f==='repFrom')st.sheet.from=el.value;else st.sheet.to=el.value;if(st.sheet.from>st.sheet.to)st.sheet.from=st.sheet.to;renderSheet()}
  else if(el.id==='impfile'&&el.files[0]){const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(el.files[0])}
});
function updSummary(){const s=dayStats(st.date),v=$$('.summary .v');if(v.length===3){v[0].textContent=s.n;v[1].textContent=s.sets;v[2].innerHTML=`${fvol(s.vol)}<small>${U()}</small>`}}
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{if(st.view!=='record'||st.sheet||e.target.closest('input,textarea,select,.hscroll')){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>70&&Math.abs(dy)<45){st.date=addDays(st.date,dx<0?1:-1);render()}},{passive:true});

document.addEventListener('paste',ev=>{if(ev.target.id!=='menuPaste'||!ev.clipboardData)return;const html=ev.clipboardData.getData('text/html'),text=ev.clipboardData.getData('text/plain');if(!html&&!text)return;ev.preventDefault();runMenuParse(text||new DOMParser().parseFromString(html,'text/html').body.textContent,html)});
document.addEventListener('submit',async ev=>{
  const f=ev.target;ev.preventDefault();
  if(f.id==='suppForm'){const name=$('#spName').value.trim();if(!name)return;const t=parseInt($('#spTgt').value),pr=parseFloat($('#spPro').value);
    const v={name,amt:$('#spAmt').value.trim(),target:isNaN(t)||t<1?null:t,pro:isNaN(pr)?null:pr};
    if(st.sheet.edit)Object.assign(D.supps.items.find(x=>x.id===st.sheet.edit),v);else D.supps.items.push({id:uid(),...v});
    save();render();st.sheet={type:'supp'};renderSheet();toast('保存しました');return}
  if(f.id==='bagForm'){const v=$('#bagNew').value.trim();if(v){D.bag.items.push({id:uid(),name:v});save();renderSheet();setTimeout(()=>$('#bagNew')?.focus(),30)}return}
  if(f.id==='loginForm'){
    const btn=$('#lgBtn');btn.disabled=true;btn.textContent='ログイン中…';st.lastEmail=$('#lgEmail').value.trim();
    let err;try{err=await login(st.lastEmail,$('#lgPass').value)}catch(e){err=e instanceof NetErr?'接続できません。電波と接続先の設定を確認してください':String(e.message||e)}
    if(err){st.authMsg=err;st.authOk=false;render();return}
    st.authMsg='';startApp();
  }else if(f.id==='setupForm'){
    const url=$('#cfgUrl').value.trim(),key=$('#cfgKey').value.trim();
    if(!/^https:\/\/[^\s]+$/.test(url)){st.authMsg='URLは https:// から始めてください';st.authOk=false;render();return}
    cfg={url,key};lsSet(CFG_KEY,cfg);st.authMsg='';st.screen=ses?'loading':'login';if(ses)startApp();else render();
  }else if(f.id==='newpassForm'){
    const a=$('#np1').value,b=$('#np2').value;
    if(a!==b){st.authMsg='2つのパスワードが一致しません';st.authOk=false;render();return}
    let err;try{err=await setNewPassword(a)}catch(e){err='接続できません'}
    if(err){st.authMsg=err;st.authOk=false;render();return}
    st.authMsg='';toast('パスワードを変更しました');startApp();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ses&&!st.demo&&D)syncRun('pull')});
window.addEventListener('online',()=>{if(ses&&!st.demo&&(D||st.screen==='loading'))syncRun('pull')});
(async()=>{
  if(await handleAuthHash())return;
  if(!cfg){st.screen='setup';render();return}
  if(ses)startApp();else{st.screen='login';render()}
})();
})();
</script>
